# 매주 월·수·목·금: 최신 공고 수집 → 릴스 2편 생성 → 사이트에 영상 공개 → 07:00 PART 1, 07:10 PART 2 인스타그램 게시
#   월: 전국 '이번 주 접수 시작' TOP 10 / 수: 서울 TOP 10 / 목: 경기·인천 TOP 10 / 금: 경상권(경북·경남·부산·대구·울산) TOP 10
name: weekly-reels

on:
  schedule:
    - cron: "20 21 * * 0,2,3,4"   # UTC 일·화·수·목 21:20 = KST 월·수·목·금 06:20 (GitHub 예약은 늦을 수 있어 미리 시작)
  workflow_dispatch:
    inputs:
      post:
        description: "인스타그램에 실제로 게시 (false면 영상만 만들고 미리보기)"
        type: boolean
        default: false
      region:
        description: "영상 종류 (auto = 요일에 맞춰 자동)"
        type: choice
        options: [auto, 전국, 서울, 경기, 경상]
        default: auto
  push:
    branches: [main]
    paths: [".github/workflows/weekly-reels.yml", "post_reels.py", "make_video.py"]   # 설정을 바꾸면 게시 없이 시험 실행 (커밋 메시지 [region:서울] 등으로 지역 지정)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: daily-update        # 매일 사이트 갱신 작업과 겹치지 않게 순서대로 실행
  cancel-in-progress: false

jobs:
  reels:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}
    env:
      DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      TZ: Asia/Seoul
      SITE_URL: https://dia1117sq.github.io/korea-lease-notice
      # 예약 실행, 수동 실행에서 '게시' 체크, 또는 커밋 메시지에 [post-now]가 있을 때만 실제 게시
      DRY_RUN: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.post) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[post-now]'))) && '0' || '1' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 글꼴·도구 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-cjk-extra ffmpeg > /dev/null
          fc-list | grep -c NotoSansCJK
          pip install -q pillow

      - name: 최신 공고 수집
        continue-on-error: true
        run: |
          python collect_myhome.py
          python collect_lh.py
          python enrich_lh_supply.py 300
          python collect_applyhome.py
          python collect_sh.py
          python collect_gh.py || true
      - name: 통합·사이트·영상 생성
        env:
          REGION_INPUT: ${{ inputs.region || 'auto' }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          python merge.py
          python build_site.py
          # 요일(KST)에 맞춰 영상 종류 선택: 월=전국, 수=서울, 목=경기·인천, 금=경상권
          R="$REGION_INPUT"
          if [ "$R" = "auto" ]; then
            case "$COMMIT_MSG" in *"[region:서울]"*) R=서울;; *"[region:경기]"*) R=경기;; *"[region:경상]"*) R=경상;; esac
          fi
          if [ "$R" = "auto" ]; then
            case "$(date +%u)" in 3) R=서울;; 4) R=경기;; 5) R=경상;; *) R=전국;; esac
          fi
          echo "::notice::영상 종류: $R"
          if [ "$R" = "전국" ]; then python make_video.py "$(date +%F)"; else python make_video.py "$(date +%F)" --region "$R"; fi
          mkdir -p site/reels
          cp video/*.mp4 site/reels/
          ls -la site/reels

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      # 업로드 직후엔 GitHub가 파일을 아직 못 찾는 경우가 있어 잠시 기다린 뒤, 실패하면 1분 간격으로 최대 3번
      - run: sleep 20
      - id: deploy1
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - if: steps.deploy1.outcome == 'failure'
        run: sleep 60
      - id: deploy2
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 90
      - id: deploy3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v5

      - name: 인스타그램 토큰 확인
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python post_reels.py check

      - name: 인스타그램 게시 (07:00 PART 1, 07:10 PART 2)
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          T=$(date +%Y%m%d)
          sleep 30   # 사이트 반영 대기
          ARGS=()
          P1=$(ls video/reel_${T}*_1.mp4 2>/dev/null | head -1)
          if [ -n "$P1" ]; then
            B=$(basename "$P1" _1.mp4)                       # 예: reel_20261125_seoul
            C=${B/reel_/caption_}
            ARGS+=("$SITE_URL/reels/${B}_1.mp4|video/${C}_1.txt|07:00")
            [ -f "video/${B}_2.mp4" ] && ARGS+=("$SITE_URL/reels/${B}_2.mp4|video/${C}_2.txt|07:10")
          else
            F=$(ls video/reel_${T}*.mp4 | head -1); B=$(basename "$F" .mp4); C=${B/reel_/caption_}
            ARGS+=("$SITE_URL/reels/${B}.mp4|video/${C}.txt|07:00")
          fi
          python post_reels.py "${ARGS[@]}"

      - name: 영상·캡션 보관 (Actions 실행 화면에서 내려받기)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reels
          path: video/
          retention-days: 30
